name: Déploiement en continu

on:
    push:
      branches: [ oli_security , ccl_security ]

jobs:
  publish:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Recréer App.config depuis un secret
      run: |
        cat <<EOF > LoginApp/App.config
        ${{ secrets.APP_CONFIG_PROD }}
        EOF
      shell: bash

    - name: Publish WPF app
      run: >
        dotnet publish LoginApp/LoginApp.csproj
        --configuration Release
        --runtime win-x64
        --self-contained true
        --output publish
    
    - name: Create ZIP archive
      run: Compress-Archive -Path publish/* -DestinationPath LoginApp.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: LoginApp.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}